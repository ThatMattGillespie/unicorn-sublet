<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Serif:ital@1&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#F2C4DE;font-family:"Bricolage Grotesque",sans-serif;color:#1E1024;position:relative;
    background-image:radial-gradient(circle at 50% 0,transparent 13px,rgba(30,16,36,.22) 13px,rgba(30,16,36,.22) 15px,transparent 15.5px);background-size:30px 18px}
  .bar{position:absolute;top:0;left:0;right:0;height:54px;background:#6A2C86;border-bottom:4px solid #1E1024;color:#F2C4DE;
    font:700 20px "Space Mono",monospace;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:22px;padding-left:48px;white-space:nowrap}
  .bar i{font-style:normal;color:#B23C7E}
  .copy{position:absolute;left:48px;top:96px;width:640px}
  .the{font:italic 64px "Instrument Serif",serif;color:#6A2C86;line-height:1}
  .uni{font-weight:800;font-size:132px;line-height:.9;color:#6A2C86;-webkit-text-stroke:4px #1E1024;text-shadow:7px 7px 0 #1E1024;text-transform:uppercase;letter-spacing:-.02em}
  .castle{display:inline-block;margin-top:14px;font-weight:800;font-size:132px;line-height:.9;text-transform:uppercase;letter-spacing:-.02em;background:#B23C7E;color:#FFF7FA;
    border:4px solid #1E1024;box-shadow:10px 10px 0 #1E1024;padding:0 18px 8px;transform:rotate(-1.5deg)}
  .sub{margin-top:36px;display:inline-block;background:#1E1024;color:#FFF7FA;font:700 24px "Space Mono",monospace;padding:10px 16px;letter-spacing:.02em}
  .photo{position:absolute;right:56px;top:96px;width:372px;height:480px;border:4px solid #1E1024;box-shadow:12px 12px 0 #6A2C86;transform:rotate(3deg);overflow:hidden;background:#1E1024}
  .photo img{width:100%;height:100%;object-fit:cover}
  .badge{position:absolute;right:360px;bottom:44px;width:168px;height:168px;border-radius:50%;background:#FFF7FA;border:4px solid #1E1024;box-shadow:6px 6px 0 #1E1024;
    display:grid;place-content:center;text-align:center;transform:rotate(-12deg);font-weight:800;line-height:.95}
  .badge b{font-size:42px;color:#B23C7E;display:block}
  .badge span{font:700 15px "Space Mono",monospace;text-transform:uppercase}
</style></head>
<body>
  <div class="bar">2 rooms <i>✦</i> Jan + Feb <i>✦</i> West Oakland <i>✦</i> Utilities included <i>✦</i> Furnished</div>
  <div class="copy">
    <div class="the">Live in</div>
    <div class="uni">Unicorn</div>
    <div class="castle">Castle</div><br>
    <div class="sub">2 furnished rooms · from $1,050/mo</div>
  </div>
  <div class="photo"><img src="../img/castle.jpg" alt=""></div>
  <div class="badge"><b>ALL</b><span>utilities<br>included</span></div>
</body></html>
